<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyber Shield</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header class="popup-header">
      <div class="popup-brand">
        <svg width="24" height="24" viewBox="0 0 100 100" fill="none" class="brand-icon">
          <rect width="100" height="100" rx="25" fill="#0A66C2" />
          <path d="M 50 20 L 76 28 C 76 54 64 69 50 80 C 36 69 24 54 24 28 Z" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" />
          <path d="M 50 28 L 68 34 C 68 53 59 63 50 72 C 41 63 32 53 32 34 Z" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" />
          <path d="M 50 37 L 60 41 C 60 52 55 58 50 63 C 45 58 40 52 40 41 Z" fill="#FFFFFF" />
        </svg>
        <h1 class="brand-title">Cyber Shield</h1>
      </div>
    </header>

    <main class="popup-main">
      <p class="instruction">Select text on any page, choose Job offer, UPI or payment, or Message, and click Check.</p>

      <div class="toggle-card">
        <label class="toggle-label" for="chip-toggle">
          <span class="toggle-text">Show the Check chip when I select text</span>
          <div class="switch-wrap">
            <input type="checkbox" id="chip-toggle" checked aria-label="Show the Check chip when I select text">
            <span class="switch-slider"></span>
          </div>
        </label>
      </div>

      <button type="button" id="open-site-btn" class="open-btn">
        Open Cyber Shield
      </button>

      <p class="privacy-note">Nothing is sent until you click Check this.</p>
    </main>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
